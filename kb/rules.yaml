version: 1
rules:
  - id: GUARD-MULTI-SALAD-LIST
    priority: 200
    enabled: true
    action: MALFORMED
    entity_class: MALFORMED
    confidence: 0.99
    provenance: "KB_PIPELINE_PROMPT guardrail 6/15"
    when:
      title_regex: "(?:салат.*[,;|].*){3,}"

  - id: CTX-DESSERT-POTATO
